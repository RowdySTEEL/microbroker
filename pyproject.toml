[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microbroker"
version = "0.30.0"
description = "News and sentiment assisted research platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
stream = ["websockets>=16,<17"]
analysis = ["torch>=2.6,<3", "transformers>=4.57.3,<5"]

[project.scripts]
microbroker = "microbroker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
