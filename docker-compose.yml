services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: microbroker
      POSTGRES_USER: microbroker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - microbroker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microbroker -d microbroker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  microbroker_pg:
